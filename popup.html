<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <title>X 未回关筛选</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>X 未回关筛选</h1>
      <p>关掉之后，页面上的面板、红框和淡化都会撤掉。下次打开扩展图标就能再打开。</p>
      <label class="row">
        <input id="enabled" type="checkbox" checked />
        <span>启用扩展</span>
      </label>
      <label class="row">
        <input id="dim" type="checkbox" />
        <span>淡化不是这类的人</span>
      </label>
      <button id="toggle" type="button">显示 / 收起面板</button>
      <p id="status"></p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
